<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada. · Arquivo da Responsabilidade</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--lime:#c6f24e;--line:#2a2a2a}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:400 15px/1.55 "Archivo",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.w{max-width:600px;margin:0 auto;width:100%;padding:0 16px}header{border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;padding:14px 0}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-decoration:none}
.logo i{width:24px;height:24px;background:var(--lime);color:#000;display:grid;place-items:center;font-style:normal;font-size:12px;position:relative;overflow:hidden}
.logo i img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.logo i.has{background:transparent}.logo i.has b{display:none}.logo i b{font-style:normal}
main{flex:1;padding:56px 0 40px}.lab{font:500 11px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);display:flex;gap:12px;align-items:center;margin-bottom:18px}
.lab:before{content:"";width:24px;height:1px;background:var(--lime)}.num{font:800 clamp(84px,26vw,140px)/1 "Archivo",Arial,sans-serif;color:transparent;-webkit-text-stroke:2px var(--lime);margin:0 0 18px}
h1{font-size:clamp(26px,7.5vw,36px);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;line-height:1.05}p{margin:0 0 8px;color:#a0a0a0}.en{font-size:13.5px;color:#777}
.btns{margin-top:28px;display:grid;gap:10px}.btn{display:block;text-align:center;background:var(--lime);color:#000;border:1px solid var(--lime);padding:14px;font:700 11px "Archivo",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:letter-spacing .3s}
.btn:hover{letter-spacing:.28em}.btn.o{background:transparent;color:#fff;border-color:#555}nav{margin-top:28px;border-top:1px solid var(--line)}nav a{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:#fff;text-decoration:none;font:500 11px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
nav a:hover{color:var(--lime)}footer{padding:24px 0 36px;font:400 10px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#666}:focus-visible{outline:2px solid var(--lime);outline-offset:2px}</style></head><body>
<header><div class="w top"><a class="logo" href="/"><i><img src="/imagens/logo.png" alt="" onload="this.parentNode.classList.add('has')" onerror="this.remove()"><b>A</b></i>Arquivo da Responsabilidade</a></div></header>
<main><div class="w"><div class="lab">Erro 404</div><div class="num" aria-hidden="true">404</div>
<h1>Página não encontrada.</h1><p>O endereço não existe ou foi movido. Use os atalhos abaixo para continuar.</p><p class="en">Page not found. The address does not exist or was moved.</p>
<div class="btns"><a class="btn o" href="/">Voltar ao início · Back to home</a></div>
</div></main>
<footer><div class="w">Construído para a democracia.</div></footer></body></html>
